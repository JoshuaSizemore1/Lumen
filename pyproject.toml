[project]
name = "lumen"
version = "0.1.0"
description = "Local-first daily assistant"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6",
    "httpx>=0.27",
]

[project.scripts]
lumen-daemon = "lumen.daemon.__main__:main"
lumen-ui = "lumen.ui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
