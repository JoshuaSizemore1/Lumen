[project]
name = "lumen"
version = "0.1.0"
description = "Local-first daily assistant"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.6",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "httpx>=0.27",
    "mcp>=1.28.1",
    "python-dateutil>=2.9.0.post0",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
lumen = "lumen.launch:main"
lumen-daemon = "lumen.daemon.__main__:main"
lumen-ui = "lumen.ui_v3.app:main"       # primary UI (Relay-styled)
lumen-ui-v3 = "lumen.ui_v3.app:main"    # explicit alias for the primary UI
lumen-ui-v2 = "lumen.ui_v2.app:main"    # archived previous shell, kept as a fallback
lumen-google-auth = "lumen.daemon.connectors.google_auth:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lumen"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
