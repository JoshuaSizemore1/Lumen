<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen — Confirmation dialog (reference)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---- Static visual reference for PyQt6. Not production code. See tokens.md. ---- */
  *{box-sizing:border-box}
  :root{--ac:#7aa2f7;--ac-soft:#7aa2f71f}
  body{margin:0;background:#1a1b26;color:#c0caf5;font-family:'JetBrains Mono',ui-monospace,monospace}
  .sans{font-family:'IBM Plex Sans',system-ui,sans-serif}
  /* dimmed backdrop over the whole window (modal) */
  .backdrop{position:fixed;inset:0;background:rgba(6,7,11,.72);display:flex;align-items:center;justify-content:center}
  /* dialog — intentionally "heavier": accent border + accent glow ring */
  .dialog{width:480px;max-width:calc(100% - 40px);background:#1c1d28;border:1px solid var(--ac);border-radius:11px;
          box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 4px var(--ac-soft);overflow:hidden}
  .d-head{display:flex;align-items:center;gap:11px;padding:16px 18px 12px;border-bottom:1px solid #262838}
  .d-icon{width:30px;height:30px;border-radius:7px;background:var(--ac-soft);border:1px solid var(--ac);display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:15px;flex:none}
  .d-title{font-size:14px;font-weight:600;color:#c0caf5}
  .d-warn{font-size:10.5px;color:#e0af68;letter-spacing:.4px}
  .d-body{padding:14px 18px}
  .intro{font-size:12.5px;color:#8a90b3;margin-bottom:12px;line-height:1.5}
  /* key/value "what will happen" box */
  .kv{background:#12131b;border:1px solid #262838;border-radius:7px;padding:10px 12px}
  .kv .r{display:flex;gap:12px;padding:5px 0;align-items:baseline}
  .kv .k{width:64px;flex:none;font-size:11px;color:#565f89;text-align:right}
  .kv .v{flex:1;font-size:12.5px;color:#c0caf5;line-height:1.45}
  .actions{display:flex;gap:10px;padding:12px 18px 16px}
  .btn-cancel{flex:1;background:transparent;border:1px solid #3b4261;color:#a9b1d6;font-size:13px;padding:9px;border-radius:7px;cursor:pointer;font-family:inherit}
  .btn-confirm{flex:1.4;background:var(--ac);border:1px solid var(--ac);color:#0d0e14;font-size:13px;font-weight:600;padding:9px;border-radius:7px;cursor:pointer;font-family:inherit}
  .kb{color:#565f89;font-size:10px}
  .kb-inv{opacity:.6;font-size:10px}
</style>
</head>
<body>
  <!-- Confirmation dialog: appears ONLY before external write actions
       (send email, create calendar event). Book/todo edits never trigger it.
       Deliberately heavier than the rest of the UI — a safety checkpoint.
       Shows exactly what will happen as key/value rows. Cancel = esc, Confirm = ⌘↵. -->
  <div class="backdrop">
    <div class="dialog">
      <div class="d-head">
        <span class="d-icon">&#9993;</span>
        <div>
          <div class="d-title">Send email</div>
          <div class="d-warn">&#9888; WRITE ACTION · TOUCHES A CONNECTED ACCOUNT</div>
        </div>
      </div>
      <div class="d-body">
        <div class="intro sans">Lumen will send this message from your connected Gmail account.</div>
        <div class="kv">
          <div class="r"><span class="k">To</span><span class="v">priya.nair@company.com</span></div>
          <div class="r"><span class="k">Subject</span><span class="v">Re: sync interval defaults</span></div>
          <div class="r"><span class="k">Body</span><span class="v">Agreed — let’s ship 15 min as the default and expose it in [sync]. I’ll update the README today.</span></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-cancel">Cancel <span class="kb">esc</span></button>
        <button class="btn-confirm">Send email <span class="kb-inv">&#8984;&#8629;</span></button>
      </div>
    </div>
  </div>
</body>
</html>
